<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON Formatter & Cleaner – Validate, Pretty Print, Minify JSON Online</title>
    <meta name="description" content="Free JSON Formatter + Cleaner to validate, pretty-print, minify, and remove hidden Unicode characters like zero-width spaces, BOM, and NBSP. 100% private and browser-based.">
    <link rel="canonical" href="https://unicodecleaner.online/json-cleaner.html">
    <meta property="og:title" content="JSON Formatter & Cleaner – Validate, Pretty Print, Minify">
    <meta property="og:description" content="Validate JSON, pretty print, minify, and clean hidden characters instantly. 100% client-side and secure.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://unicodecleaner.online/json-cleaner.html">
    <meta property="og:image" content="https://unicodecleaner.online/unicode-cleaner-preview.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="JSON Formatter & Cleaner – Validate, Pretty Print, Minify">
    <meta name="twitter:description" content="Professional JSON formatter and cleaner to validate, prettify, minify, and remove hidden characters.">
    <meta name="twitter:image" content="https://unicodecleaner.online/unicode-cleaner-preview.png">
    <meta name="author" content="UnicodeCleaner.online">
    <meta name="theme-color" content="#4f46e5">
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "JSON Formatter + Cleaner",
      "url": "https://unicodecleaner.online/json-cleaner.html",
      "applicationCategory": "DeveloperApplication",
      "operatingSystem": "Web Browser",
      "description": "Validate, pretty print, minify, and clean hidden Unicode characters in JSON instantly. Fully client-side.",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      }
    }
    </script>
    <style>
        :root {
            color-scheme: light;
            --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            --font-mono: 'JetBrains Mono', 'SFMono-Regular', Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace;

            --space-1: 8px;
            --space-2: 16px;
            --space-3: 24px;
            --space-4: 32px;

            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;

            --bg-body: #f4f6fb;
            --bg-elevated: #ffffff;
            --bg-input: #fbfcff;
            --bg-soft: #eef2ff;
            --text-main: #111827;
            --text-muted: #667085;
            --text-soft: #98a2b3;
            --border: #e4e7ec;
            --border-strong: #d0d5dd;

            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --success-bg: #ecfdf3;
            --success-text: #027a48;
            --error-bg: #fef3f2;
            --error-text: #b42318;

            --shadow-sm: 0 1px 2px rgba(16, 24, 40, 0.06);
            --shadow-md: 0 10px 30px rgba(16, 24, 40, 0.06);
        }

        [data-theme='dark'] {
            color-scheme: dark;
            --bg-body: #0b1020;
            --bg-elevated: #121a2b;
            --bg-input: #0f1728;
            --bg-soft: #1c2540;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --text-soft: #64748b;
            --border: #27314a;
            --border-strong: #334155;

            --primary: #7c89ff;
            --primary-hover: #6674f3;
            --success-bg: rgba(16, 185, 129, 0.2);
            --success-text: #6ee7b7;
            --error-bg: rgba(239, 68, 68, 0.2);
            --error-text: #fca5a5;

            --shadow-sm: 0 1px 2px rgba(2, 6, 23, 0.5);
            --shadow-md: 0 14px 36px rgba(2, 6, 23, 0.5);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: var(--font-sans);
            background: radial-gradient(1200px 520px at 16% -10%, rgba(99, 102, 241, 0.12), transparent 60%), var(--bg-body);
            color: var(--text-main);
            line-height: 1.5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: var(--space-4) var(--space-3);
            flex: 1;
            width: 100%;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: var(--space-2);
            margin-bottom: var(--space-4);
        }

        h1 { font-size: clamp(1.5rem, 3vw, 2rem); font-weight: 700; letter-spacing: -0.03em; line-height: 1.1; }
        .subtitle { font-size: 0.95rem; color: var(--text-muted); margin-top: var(--space-1); max-width: 65ch; }

        button {
            cursor: pointer;
            border: 1px solid transparent;
            outline: none;
            font-family: inherit;
            font-weight: 500;
            border-radius: 10px;
            transition: all 0.18s ease;
        }

        button:focus-visible { box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.2); }

        .btn-icon {
            background: transparent;
            color: var(--text-muted);
            padding: 10px;
            font-size: 1.125rem;
            border-color: var(--border);
        }

        .btn-icon:hover { color: var(--text-main); background-color: var(--bg-soft); }

        .app-grid { display: grid; grid-template-columns: 1fr; gap: var(--space-3); }
        @media (min-width: 860px) { .app-grid { grid-template-columns: 1fr 1fr; } }

        .card {
            background-color: var(--bg-elevated);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-sm), var(--shadow-md);
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .card-header {
            padding: var(--space-2) var(--space-3);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: var(--space-2);
        }

        .card-title { font-weight: 600; font-size: 0.975rem; display: flex; align-items: center; gap: 8px; }

        .badge {
            background: var(--bg-soft);
            color: var(--text-muted);
            font-size: 0.75rem;
            padding: 4px 10px;
            border-radius: 999px;
            font-weight: 600;
            border: 1px solid var(--border);
        }

        .input-wrapper { flex: 1; display: flex; }

        textarea, .output-panel {
            width: 100%;
            min-height: 360px;
            padding: var(--space-3);
            border: none;
            background-color: var(--bg-input);
            color: var(--text-main);
            font-family: var(--font-mono);
            font-size: 0.9rem;
            line-height: 1.65;
            resize: none;
            outline: none;
            white-space: pre;
            overflow: auto;
        }

        textarea::placeholder { color: var(--text-soft); }
        .output-panel { word-break: normal; }

        .status-box {
            margin: var(--space-2) var(--space-3) 0;
            padding: 10px 12px;
            border-radius: var(--radius-sm);
            font-size: 0.875rem;
            border: 1px solid transparent;
            display: none;
        }

        .status-box.success { background: var(--success-bg); color: var(--success-text); border-color: rgba(2, 122, 72, 0.25); display: block; }
        .status-box.error { background: var(--error-bg); color: var(--error-text); border-color: rgba(180, 35, 24, 0.25); display: block; }

        .actions-bar {
            padding: var(--space-2) var(--space-3);
            border-top: 1px solid var(--border);
            display: flex;
            flex-wrap: wrap;
            gap: var(--space-1);
            background-color: var(--bg-elevated);
            align-items: center;
        }

        .btn-primary {
            background: linear-gradient(180deg, var(--primary) 0%, var(--primary-hover) 100%);
            color: #fff;
            padding: 10px 14px;
            box-shadow: 0 1px 0 rgba(255,255,255,0.15) inset, 0 2px 8px rgba(79, 70, 229, 0.28);
        }

        .btn-primary:hover { filter: brightness(1.03); transform: translateY(-1px); }

        .btn-secondary {
            background: transparent;
            border: 1px solid var(--border-strong);
            color: var(--text-main);
            padding: 10px 14px;
        }

        .btn-secondary:hover { background: var(--bg-soft); }

        .meta-row { font-size: 0.75rem; color: var(--text-muted); }

        .u-flex-1 { flex: 1; }

        .toast {
            position: fixed;
            bottom: var(--space-3);
            right: var(--space-3);
            background-color: var(--text-main);
            color: var(--bg-elevated);
            padding: 10px 14px;
            border-radius: 10px;
            opacity: 0;
            transform: translateY(8px);
            transition: all 0.2s ease;
            pointer-events: none;
            box-shadow: var(--shadow-md);
        }

        .toast.show { opacity: 1; transform: translateY(0); }

        footer {
            margin-top: auto;
            padding: var(--space-4) 0;
            text-align: center;
            font-size: 0.875rem;
            color: var(--text-muted);
        }

        @media (max-width: 700px) {
            .container { padding: var(--space-3) var(--space-2); }
            header { margin-bottom: var(--space-3); }
            .card-header, .actions-bar { padding-left: var(--space-2); padding-right: var(--space-2); }
            textarea, .output-panel { min-height: 280px; padding: var(--space-2); }
        }
            </style>
</head>
<body>
<div class="container">
    <header>
        <div>
            <h1>JSON Formatter + Cleaner</h1>
            <div class="subtitle">Validate, pretty print, minify, and remove hidden characters from JSON with full client-side privacy.</div>
        </div>
        <button class="btn-icon" id="themeToggle" aria-label="Toggle Dark Mode"><span id="themeIcon">◑</span></button>
    </header>

    <div class="app-grid">
        <div class="card">
            <div class="card-header">
                <div class="card-title">Input JSON</div>
                <div class="badge" id="inputCount">0 chars</div>
            </div>
            <div class="input-wrapper">
                <textarea id="jsonInput" placeholder='Paste JSON here, e.g. {"name":"UnicodeCleaner"}'></textarea>
            </div>
            <div class="actions-bar">
                <button class="btn-secondary" id="validateBtn">Validate JSON</button>
                <button class="btn-primary" id="formatBtn">Format (Pretty Print)</button>
                <button class="btn-secondary" id="minifyBtn">Minify JSON</button>
                <button class="btn-secondary" id="cleanBtn">Clean Hidden Characters</button>
            </div>
        </div>

        <div class="card">
            <div class="card-header">
                <div class="card-title">Output / Preview</div>
                <div class="badge" id="outputCount">0 chars</div>
            </div>
            <div id="statusBox" class="status-box"></div>
            <pre class="output-panel" id="outputPanel">Your JSON result will appear here…</pre>
            <div class="actions-bar">
                <div class="meta-row" id="jsonState">Ready</div>
                <div style="flex:1"></div>
                <button class="btn-secondary" id="copyBtn">Copy Result</button>
            </div>
        </div>
    </div>

    <footer>
        &copy; 2026 Unicode Cleaner. 100% Client-Side.
    </footer>
</div>

<div class="toast" id="toast">Copied to clipboard!</div>

<script>
(() => {
    const jsonInput = document.getElementById('jsonInput');
    const outputPanel = document.getElementById('outputPanel');
    const statusBox = document.getElementById('statusBox');
    const jsonState = document.getElementById('jsonState');
    const inputCount = document.getElementById('inputCount');
    const outputCount = document.getElementById('outputCount');
    const toast = document.getElementById('toast');

    const cleanHiddenChars = (text) => text.replace(/[\u200B-\u200D\uFEFF\u00A0]/g, '');

    const setStatus = (type, message) => {
        statusBox.className = 'status-box ' + type;
        statusBox.textContent = message;
    };

    const clearStatus = () => {
        statusBox.className = 'status-box';
        statusBox.textContent = '';
    };

    const updateCounts = () => {
        inputCount.textContent = `${jsonInput.value.length} chars`;
        outputCount.textContent = `${outputPanel.textContent.length} chars`;
    };

    const parseJSON = (text) => {
        const cleaned = cleanHiddenChars(text);
        return { cleaned, parsed: JSON.parse(cleaned) };
    };

    document.getElementById('validateBtn').addEventListener('click', () => {
        try {
            parseJSON(jsonInput.value);
            setStatus('success', '✅ Valid JSON. Hidden characters were handled safely before parsing.');
            jsonState.textContent = 'Validation passed';
        } catch (error) {
            setStatus('error', `❌ Invalid JSON: ${error.message}`);
            jsonState.textContent = 'Validation failed';
        }
        updateCounts();
    });

    document.getElementById('formatBtn').addEventListener('click', () => {
        try {
            const { parsed } = parseJSON(jsonInput.value);
            const pretty = JSON.stringify(parsed, null, 2);
            outputPanel.textContent = pretty;
            setStatus('success', '✅ JSON formatted successfully with 2-space indentation.');
            jsonState.textContent = 'Pretty printed';
        } catch (error) {
            setStatus('error', `❌ Invalid JSON: ${error.message}`);
            jsonState.textContent = 'Formatting failed';
        }
        updateCounts();
    });

    document.getElementById('minifyBtn').addEventListener('click', () => {
        try {
            const { parsed } = parseJSON(jsonInput.value);
            outputPanel.textContent = JSON.stringify(parsed);
            setStatus('success', '✅ JSON minified successfully.');
            jsonState.textContent = 'Minified';
        } catch (error) {
            setStatus('error', `❌ Invalid JSON: ${error.message}`);
            jsonState.textContent = 'Minify failed';
        }
        updateCounts();
    });

    document.getElementById('cleanBtn').addEventListener('click', () => {
        const cleaned = cleanHiddenChars(jsonInput.value);
        jsonInput.value = cleaned;
        outputPanel.textContent = cleaned;
        clearStatus();
        setStatus('success', '✅ Hidden characters removed (U+200B–U+200D, U+FEFF, U+00A0).');
        jsonState.textContent = 'Input cleaned';
        updateCounts();
    });

    document.getElementById('copyBtn').addEventListener('click', async () => {
        try {
            await navigator.clipboard.writeText(outputPanel.textContent);
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 1500);
        } catch {
            setStatus('error', '❌ Could not copy automatically. Please copy manually.');
        }
    });

    jsonInput.addEventListener('input', updateCounts);

    const themeToggle = document.getElementById('themeToggle');
    const themeIcon = document.getElementById('themeIcon');
    const applyTheme = (theme) => {
        document.documentElement.setAttribute('data-theme', theme);
        themeIcon.textContent = theme === 'dark' ? '☀️' : '◑';
    };

    const savedTheme = localStorage.getItem('theme') || 'light';
    applyTheme(savedTheme);

    themeToggle.addEventListener('click', () => {
        const current = document.documentElement.getAttribute('data-theme') || 'light';
        const next = current === 'dark' ? 'light' : 'dark';
        localStorage.setItem('theme', next);
        applyTheme(next);
    });

    updateCounts();
})();
</script>
</body>
</html>
